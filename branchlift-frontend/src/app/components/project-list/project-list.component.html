<div class="container">
  <header>
    <h1>Gerenciar Projetos</h1>
    <p>Cadastre aqui os repositórios Git que poderão ser provisionados.</p>
  </header>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Adicionar Novo Projeto</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="projectForm" (ngSubmit)="onProjectSubmit()" class="project-form">
        <mat-form-field appearance="outline">
          <mat-label>Nome do Projeto</mat-label>
          <input matInput formControlName="name" placeholder="Ex: API de Pagamentos">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>URL do Repositório Git (.git)</mat-label>
          <input matInput formControlName="gitRepoUrl" placeholder="Ex: https://github.com/seu-usuario/seu-repo.git">
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" [disabled]="!projectForm.valid">
          Adicionar Projeto
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="list-card">
    <mat-card-header>
      <mat-card-title>Projetos Cadastrados</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list role="list">
        <mat-list-item *ngFor="let project of projects" role="listitem">
          <span matListItemTitle>{{project.name}}</span>
          <span matListItemLine>{{project.gitRepoUrl}}</span>
        </mat-list-item>
        <p *ngIf="projects.length === 0">Nenhum projeto cadastrado ainda.</p>
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
